[workspace]

[package]
name = "cryptosec-scanner"
version = "0.1.0"
edition = "2021"
description = "CryptoSec Lab - Local Educational Solidity Security Scanner"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
colored = "2"
anyhow = "1"
chrono = "0.4"
