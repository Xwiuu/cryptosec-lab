[package]
name = "core-chain"
version = "0.1.0"
edition = "2021"
description = "CryptoSec Lab - Educational Blockchain Core in Rust"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP API
axum = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"
blake3 = "1"

# Signatures (Ed25519)
ed25519-dalek = "2"
rand = "0.8"

# Errors
thiserror = "2"

# UUID for transaction IDs
uuid = { version = "1", features = ["v4"] }

# Hex encoding
hex = "0.4"

# Base58 for addresses
bs58 = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async mutex
parking_lot = "0.12"

# Time
chrono = "0.4"

[dev-dependencies]
# Additional test utilities if needed

[lib]
name = "core_chain"
path = "src/lib.rs"
